apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tactical-sdn.fullname" . }}
  labels:
    {{- include "tactical-sdn.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "tactical-sdn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tactical-sdn.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: {{ include "tactical-sdn.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sdn-stack
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: telemetry
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: host-modules
              mountPath: /lib/modules
              readOnly: true
            - name: sdn-config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: host-modules
          hostPath:
            path: /lib/modules
        - name: sdn-config
          configMap:
            name: {{ include "tactical-sdn.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
