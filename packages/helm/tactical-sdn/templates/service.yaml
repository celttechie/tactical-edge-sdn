apiVersion: v1
kind: Service
metadata:
  name: {{ include "tactical-sdn.fullname" . }}-telemetry
  labels:
    {{- include "tactical-sdn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tactical-sdn.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.service.name }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
