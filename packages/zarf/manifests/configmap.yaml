apiVersion: v1
kind: ConfigMap
metadata:
  name: sdn-controller-config
  namespace: tactical-sdn
  labels:
    app.kubernetes.io/name: sdn-controller
data:
  config.yaml: |
    probe_interval_sec: 0.5
    probe_window_size: 10
    sla_check_interval_sec: 1.0
    degradation_penalty_metric: 500
    down_penalty_metric: 2000
    enclave_subnet: "10.10.0.0/16"
    shore_subnet: "10.200.1.10/32"
    bearers:
      pleops:
        interface: "eth-pleops"
        gateway_ip: "10.100.1.1"
        target_ip: "10.100.1.1"
        base_metric: 10
        expected_latency_ms: 40.0
        max_latency_ms: 200.0
        max_loss_pct: 5.0
        max_jitter_ms: 50.0
      milsat:
        interface: "eth-milsat"
        gateway_ip: "10.100.2.1"
        target_ip: "10.100.2.1"
        base_metric: 50
        expected_latency_ms: 500.0
        max_latency_ms: 1200.0
        max_loss_pct: 10.0
        max_jitter_ms: 200.0
      losrf:
        interface: "eth-losrf"
        gateway_ip: "10.100.3.1"
        target_ip: "10.100.3.1"
        base_metric: 100
        expected_latency_ms: 100.0
        max_latency_ms: 400.0
        max_loss_pct: 10.0
        max_jitter_ms: 100.0
