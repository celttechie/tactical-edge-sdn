name: CI / Automated Engineering Rigor & Compliance

on:
  push:
    branches: [ main, next, "milestone-*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ main, next ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  python-quality-and-unit-tests:
    name: Python Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Code Formatting (Black & isort)
        run: |
          black --check src/ tests/
          isort --profile black --check-only src/ tests/

      - name: Lint Code (flake8)
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests/unit -p "test_*.py" -v

  helm-and-packaging-validation:
    name: Helm & Packaging Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Tactical SDN Helm Chart
        run: |
          helm lint packages/helm/tactical-sdn

      - name: Validate Zarf Package Manifest
        run: |
          # Verify zarf.yaml exists and parses cleanly as YAML
          python3 -c "import yaml; yaml.safe_load(open('packages/zarf/zarf.yaml'))"

  compliance-oscal-lint:
    name: Lula OSCAL Compliance Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Lula CLI
        run: |
          curl -sSL "https://github.com/defenseunicorns-labs/lula1/releases/download/v0.16.0/lula_v0.16.0_Linux_amd64" -o lula
          chmod +x lula
          sudo mv lula /usr/local/bin/
          lula version

      - name: Lint All Lula Validation Manifests
        run: |
          for f in compliance/lula/validations/*.yaml; do
            echo "Linting $f..."
            lula dev lint -f "$f"
          done

  container-security-and-sbom:
    name: Container Security & Syft SBOM Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CNF Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/dataplane/Dockerfile
          tags: tactical-sdn-stack:ci
          load: true

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: tactical-sdn-stack:ci
          format: cyclonedx-json
          output-file: cyclonedx-sbom.json

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: tactical-sdn-stack:ci
          format: spdx-json
          output-file: spdx-sbom.json

      - name: Upload SBOM Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tactical-sdn-sboms
          path: |
            cyclonedx-sbom.json
            spdx-sbom.json
          if-no-files-found: error

      - name: Run Trivy Vulnerability Scan (Console Summary)
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: tactical-sdn-stack:ci
          format: table
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Run Trivy Vulnerability Scan (SARIF Report)
        uses: aquasecurity/trivy-action@v0.29.0
        if: always()
        with:
          image-ref: tactical-sdn-stack:ci
          format: sarif
          output: trivy-results.sarif
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy Results to GitHub Code Scanning (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

