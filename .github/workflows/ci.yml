name: CI / Automated Engineering Rigor & Compliance

on:
  push:
    branches: [ main, next, "milestone-*", "fix/*" ]
  pull_request:
    branches: [ main, next ]

jobs:
  python-quality-and-unit-tests:
    name: Python Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pyroute2 pyyaml prometheus_client

      - name: Check Code Formatting (Black & isort)
        run: |
          black --check src/ tests/
          isort --check-only src/ tests/

      - name: Lint Code (flake8)
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests/unit -p "test_*.py" -v

  helm-and-packaging-validation:
    name: Helm & Packaging Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Tactical SDN Helm Chart
        run: |
          helm lint packages/helm/tactical-sdn

      - name: Validate Zarf Package Manifest
        run: |
          # Verify zarf.yaml exists and parses cleanly as YAML
          python3 -c "import yaml; yaml.safe_load(open('packages/zarf/zarf.yaml'))"

  compliance-oscal-lint:
    name: Lula OSCAL Compliance Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Lula CLI
        run: |
          curl -sSL "https://github.com/defenseunicorns/lula/releases/latest/download/lula_$(uname -s)_$(uname -m).tar.gz" -o lula.tar.gz || \
          curl -sSL "https://github.com/defenseunicorns/lula/releases/download/v0.8.3/lula_Linux_x86_64.tar.gz" -o lula.tar.gz
          tar -xzf lula.tar.gz lula
          sudo mv lula /usr/local/bin/
          lula version

      - name: Lint All Lula Validation Manifests
        run: |
          for f in compliance/lula/validations/*.yaml; do
            echo "Linting $f..."
            lula dev lint -f "$f"
          done
