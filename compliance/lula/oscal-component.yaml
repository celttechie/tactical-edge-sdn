component-definition:
  uuid: ef4e942c-1998-46d7-a5c0-d91298caa521
  metadata:
    title: Tactical Edge SDN Dataplane and Policy Controller Component Definition
    last-modified: "2026-10-05T12:00:00Z"
    version: "0.3.0"
    oscal-version: "1.1.2"
    parties:
      - uuid: a1051832-c39f-4136-8ab6-f6128faaa9d7
        type: organization
        name: Tactical Edge Communications Modernization Team
  components:
    - uuid: 3d8a85fc-3087-422b-a139-37a49465be3b
      type: software
      title: tactical-sdn-stack
      description: Cloud-Native Containerized SD-WAN Dataplane and Dynamic SLA Policy Controller
      purpose: Automated dynamic multi-bearer routing and traffic steering across contested DDIL environments
      control-implementations:
        - uuid: 0dfab2ab-cd51-480e-95d2-be764904defe
          source: https://github.com/usnistgov/oscal-content/blob/master/nist.gov/SP800-53/rev5/json/NIST_SP-800-53_rev5_catalog.json
          description: NIST SP 800-53 Rev 5 Control Implementations for Tactical SD-WAN Stack
          implemented-requirements:
            - uuid: 3c744348-c2e7-48f1-a822-4cda54fc0845
              control-id: sc-7
              description: Boundary Protection and Network Separation
              links:
                - href: "#a93c8860-4430-4f65-9c8f-68faaef48c77"
                  rel: lula
            - uuid: 0d3d77f0-0baa-4ec3-aade-14966c7bfdb9
              control-id: ac-3
              description: Access Enforcement and Least Privilege Capabilities
              links:
                - href: "#ada6226f-8d7f-4b8c-9bea-90606455e273"
                  rel: lula
            - uuid: fe6f31c2-86f6-4f89-9b2e-b8f1fb47d4a7
              control-id: si-4
              description: Information System Monitoring and Telemetry Service
              links:
                - href: "#50e0667d-80d9-4a3c-9307-a2deed25ffa7"
                  rel: lula
            - uuid: 7b8c9d0e-1f2a-4b3c-8d5e-6f7a8b9c0d1e
              control-id: cm-6
              description: Configuration Settings and Policy Parameters
              links:
                - href: "#8c9d0e1f-2a3b-4c4d-9e6f-7a8b9c0d1e2f"
                  rel: lula
  back-matter:
    resources:
      - uuid: a93c8860-4430-4f65-9c8f-68faaef48c77
        title: sc-7-validation
        description: Validates that the tactical SDN dataplane daemonset is deployed and active in the isolated namespace
        remarks: '{"domain":{"type":"kubernetes","kubernetes-spec":{"resources":[{"name":"sdn_daemonset","resource-rule":{"group":"apps","version":"v1","resource":"daemonsets","namespaces":["tactical-sdn"]}}]}},"provider":{"type":"opa","opa-spec":{"rego":"package validate\n\nvalidate {\n  ds := input.sdn_daemonset[0]\n  ds.status.numberReady > 0\n}\n"}}}'

      - uuid: ada6226f-8d7f-4b8c-9bea-90606455e273
        title: ac-3-validation
        description: Validates container security context enforces explicit NET_ADMIN capability assignment
        remarks: '{"domain":{"type":"kubernetes","kubernetes-spec":{"resources":[{"name":"sdn_daemonset","resource-rule":{"group":"apps","version":"v1","resource":"daemonsets","namespaces":["tactical-sdn"]}}]}},"provider":{"type":"opa","opa-spec":{"rego":"package validate\n\nvalidate {\n  ds := input.sdn_daemonset[0]\n  container := ds.spec.template.spec.containers[0]\n  container.securityContext.capabilities.add[_] == \"NET_ADMIN\"\n}\n"}}}'

      - uuid: 50e0667d-80d9-4a3c-9307-a2deed25ffa7
        title: si-4-validation
        description: Validates that the SD-WAN telemetry service is operational and exposing port 8080
        remarks: '{"domain":{"type":"kubernetes","kubernetes-spec":{"resources":[{"name":"sdn_service","resource-rule":{"group":"","version":"v1","resource":"services","namespaces":["tactical-sdn"]}}]}},"provider":{"type":"opa","opa-spec":{"rego":"package validate\n\nvalidate {\n  svc := input.sdn_service[0]\n  svc.metadata.name == \"sdn-telemetry\"\n  svc.spec.ports[0].port == 8080\n}\n"}}}'

      - uuid: 8c9d0e1f-2a3b-4c4d-9e6f-7a8b9c0d1e2f
        title: cm-6-validation
        description: Validates that the SD-WAN controller ConfigMap defines SLA thresholds for all three tactical bearers
        remarks: '{"domain":{"type":"kubernetes","kubernetes-spec":{"resources":[{"name":"sdn_configmap","resource-rule":{"group":"","version":"v1","resource":"configmaps","namespaces":["tactical-sdn"]}}]}},"provider":{"type":"opa","opa-spec":{"rego":"package validate\n\nvalidate {\n  cm := input.sdn_configmap[0]\n  cm.metadata.name == \"sdn-controller-config\"\n  contains(cm.data[\"config.yaml\"], \"pleops\")\n  contains(cm.data[\"config.yaml\"], \"milsat\")\n  contains(cm.data[\"config.yaml\"], \"losrf\")\n}\n"}}}'
