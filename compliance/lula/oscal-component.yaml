component-definition:
  back-matter:
    resources:
      - description: |
          domain:
            kubernetes-spec:
              create-resources: null
              resources:
              - description: ""
                name: sdn_daemonset
                resource-rule:
                  group: apps
                  name: ""
                  namespaces:
                  - tactical-sdn
                  resource: daemonsets
                  version: v1
            type: kubernetes
          lula-version: ""
          metadata:
            name: ac-3-validation
            uuid: ada6226f-8d7f-4b8c-9bea-90606455e273
          provider:
            opa-spec:
              rego: |
                package validate

                validate {
                  ds := input.sdn_daemonset[0]
                  container := ds.spec.template.spec.containers[0]
                  container.securityContext.privileged == false
                  container.securityContext.allowPrivilegeEscalation == false
                  container.securityContext.readOnlyRootFilesystem == true
                  container.securityContext.capabilities.drop[_] == "ALL"
                  container.securityContext.capabilities.add[_] == "NET_ADMIN"
                  container.securityContext.capabilities.add[_] == "NET_RAW"
                }
            type: opa
        title: ac-3-validation
        uuid: ada6226f-8d7f-4b8c-9bea-90606455e273
      - description: |
          domain:
            kubernetes-spec:
              create-resources: null
              resources:
              - description: ""
                name: sdn_configmap
                resource-rule:
                  group: ""
                  name: ""
                  namespaces:
                  - tactical-sdn
                  resource: configmaps
                  version: v1
            type: kubernetes
          lula-version: ""
          metadata:
            name: cm-6-validation
            uuid: 8c9d0e1f-2a3b-4c4d-9e6f-7a8b9c0d1e2f
          provider:
            opa-spec:
              rego: |
                package validate

                validate {
                  cm := input.sdn_configmap[_]
                  cm.metadata.name == "tactical-sdn-config"
                  contains(cm.data["config.yaml"], "pleops")
                  contains(cm.data["config.yaml"], "milsat")
                  contains(cm.data["config.yaml"], "losrf")
                }
            type: opa
        title: cm-6-validation
        uuid: 8c9d0e1f-2a3b-4c4d-9e6f-7a8b9c0d1e2f
      - description: |
          domain:
            kubernetes-spec:
              create-resources: null
              resources:
              - description: ""
                name: sdn_daemonset
                resource-rule:
                  group: apps
                  name: ""
                  namespaces:
                  - tactical-sdn
                  resource: daemonsets
                  version: v1
            type: kubernetes
          lula-version: ""
          metadata:
            name: sc-7-validation
            uuid: a93c8860-4430-4f65-9c8f-68faaef48c77
          provider:
            opa-spec:
              rego: |
                package validate

                validate {
                  ds := input.sdn_daemonset[_]
                  ds.metadata.name == "tactical-sdn"
                  ds.status.numberReady > 0
                }
            type: opa
        title: sc-7-validation
        uuid: a93c8860-4430-4f65-9c8f-68faaef48c77
      - description: |
          domain:
            kubernetes-spec:
              create-resources: null
              resources:
              - description: ""
                name: sdn_service
                resource-rule:
                  group: ""
                  name: ""
                  namespaces:
                  - tactical-sdn
                  resource: services
                  version: v1
            type: kubernetes
          lula-version: ""
          metadata:
            name: si-4-validation
            uuid: 50e0667d-80d9-4a3c-9307-a2deed25ffa7
          provider:
            opa-spec:
              rego: |
                package validate

                validate {
                  svc := input.sdn_service[_]
                  svc.metadata.name == "tactical-sdn-telemetry"
                  svc.spec.ports[_].port == 8080
                }
            type: opa
        title: si-4-validation
        uuid: 50e0667d-80d9-4a3c-9307-a2deed25ffa7
  components:
    - control-implementations:
        - description: NIST SP 800-53 Rev 5 Control Implementations for Tactical SD-WAN Stack
          implemented-requirements:
            - control-id: ac-3
              description: Access Enforcement and Least Privilege Capabilities
              links:
