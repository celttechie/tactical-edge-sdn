                  rel: lula
              uuid: 0d3d77f0-0baa-4ec3-aade-14966c7bfdb9
            - control-id: cm-6
              description: Configuration Settings and Policy Parameters
              links:
                - href: '#8c9d0e1f-2a3b-4c4d-9e6f-7a8b9c0d1e2f'
                  rel: lula
              uuid: 7b8c9d0e-1f2a-4b3c-8d5e-6f7a8b9c0d1e
            - control-id: sc-7
              description: Boundary Protection and Network Separation
              links:
                - href: '#a93c8860-4430-4f65-9c8f-68faaef48c77'
                  rel: lula
              uuid: 3c744348-c2e7-48f1-a822-4cda54fc0845
            - control-id: si-4
              description: Information System Monitoring and Telemetry Service
              links:
