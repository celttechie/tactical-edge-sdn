metadata:
  name: si-4-validation
  uuid: 50e0667d-80d9-4a3c-9307-a2deed25ffa7
domain:
  type: kubernetes
  kubernetes-spec:
    resources:
      - name: sdn_service
        resource-rule:
          group: ""
          version: v1
          resource: services
          namespaces: [tactical-sdn]
provider:
  type: opa
  opa-spec:
    rego: |
      package validate

      validate {
        svc := input.sdn_service[_]
        svc.metadata.name == "tactical-sdn-telemetry"
        svc.spec.ports[_].port == 8080
      }
