#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.tactical.local
manage_etc_hosts: true

users:
  - name: bjarrett
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, netdev]
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/sysctl.d/99-router.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0

  - path: /etc/systemd/system/legacy-nat.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Legacy Static NAT and Forwarding Baseline
      After=network.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/iptables -t nat -A POSTROUTING -s 10.10.0.0/16 -o eth-pleops -j MASQUERADE
      ExecStart=/usr/sbin/iptables -t nat -A POSTROUTING -s 10.10.0.0/16 -o eth-milsat -j MASQUERADE
      ExecStart=/usr/sbin/iptables -t nat -A POSTROUTING -s 10.10.0.0/16 -o eth-losrf -j MASQUERADE
      ExecStart=/usr/sbin/iptables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      ExecStart=/usr/sbin/iptables -A FORWARD -s 10.10.0.0/16 -j ACCEPT

      [Install]
      WantedBy=multi-user.target

runcmd:
  - sysctl --system
  - systemctl daemon-reload
  - systemctl enable --now legacy-nat.service
