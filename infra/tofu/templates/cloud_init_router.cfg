#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.tactical.local
manage_etc_hosts: true

users:
  - name: ${admin_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, netdev]
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_keys:
  ed25519_private: |
    ${indent(4, host_private_key)}
  ed25519_public: ${host_public_key}

write_files:
  - path: /etc/sysctl.d/99-router.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0

  - path: /etc/systemd/system/legacy-nat.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Legacy Static NAT and Forwarding Baseline
      After=network.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/iptables -t nat -A POSTROUTING -s 10.10.0.0/16 -o eth-pleops -j MASQUERADE
      ExecStart=/usr/sbin/iptables -t nat -A POSTROUTING -s 10.10.0.0/16 -o eth-milsat -j MASQUERADE
      ExecStart=/usr/sbin/iptables -t nat -A POSTROUTING -s 10.10.0.0/16 -o eth-losrf -j MASQUERADE
      ExecStart=/usr/sbin/iptables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
      ExecStart=/usr/sbin/iptables -A FORWARD -s 10.10.0.0/16 -j ACCEPT

  - path: /etc/systemd/system/sdwan-controller.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Tactical Edge SD-WAN Dynamic Policy Controller
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/tactical-sdn
      ExecStart=/usr/bin/python3 -m src.controller.main --interval 0.5 --check-interval 1.0
      Restart=always
      RestartSec=2
      Environment=PYTHONPATH=/opt/tactical-sdn

      [Install]
      WantedBy=multi-user.target

  - path: /tmp/app_bundle.zip.b64
    permissions: '0600'
    content: |
      ${app_zip_b64}

runcmd:
  - sysctl --system
  - mkdir -p /opt/tactical-sdn/src
  - base64 -d /tmp/app_bundle.zip.b64 > /tmp/app_bundle.zip
  - python3 -m zipfile -e /tmp/app_bundle.zip /opt/tactical-sdn/src
  - chown -R ${admin_username}:${admin_username} /opt/tactical-sdn
  - rm -f /tmp/app_bundle.zip*
  - systemctl daemon-reload
  - systemctl enable --now legacy-nat.service
  - systemctl enable --now sdwan-controller.service
