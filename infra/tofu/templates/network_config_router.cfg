version: 2
ethernets:
  eth0:
    match:
      macaddress: "52:54:00:10:01:01"
    set-name: eth-unclass
    addresses:
      - 10.10.1.1/24
  eth1:
    match:
      macaddress: "52:54:00:10:02:01"
    set-name: eth-secret
    addresses:
      - 10.10.2.1/24
  eth2:
    match:
      macaddress: "52:54:00:20:01:02"
    set-name: eth-pleops
    addresses:
      - 10.100.1.2/24
    routes:
      - to: default
        via: 10.100.1.1
        metric: 10
      - to: 10.200.1.0/24
        via: 10.100.1.1
        metric: 10
  eth3:
    match:
      macaddress: "52:54:00:20:02:02"
    set-name: eth-milsat
    addresses:
      - 10.100.2.2/24
    routes:
      - to: default
        via: 10.100.2.1
        metric: 50
      - to: 10.200.1.0/24
        via: 10.100.2.1
        metric: 50
  eth4:
    match:
      macaddress: "52:54:00:20:03:02"
    set-name: eth-losrf
    addresses:
      - 10.100.3.2/24
    routes:
      - to: default
        via: 10.100.3.1
        metric: 100
      - to: 10.200.1.0/24
        via: 10.100.3.1
        metric: 100
  eth5:
    match:
      macaddress: "52:54:00:30:01:02"
    set-name: eth-mgmt
    addresses:
      - 10.200.1.2/24
