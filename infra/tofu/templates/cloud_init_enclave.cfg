#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.tactical.local
manage_etc_hosts: true

users:
  - name: ${admin_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, netdev]
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_keys:
  ed25519_private: |
    ${indent(4, host_private_key)}
  ed25519_public: ${host_public_key}

write_files:
  - path: /opt/enclave-client/c2_probe.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      import time
      import urllib.request
      import json
      import sys
      import datetime

      TARGET_URL = "http://10.200.1.10:8080"

      print(f"Starting Enclave C2 Heartbeat Prober targeting {TARGET_URL}...")
      seq = 0
      while True:
          seq += 1
          t0 = time.time()
          ts = datetime.datetime.utcnow().isoformat()
          try:
              req = urllib.request.Request(
                  TARGET_URL,
                  data=json.dumps({"seq": seq, "timestamp": ts, "source": "enclave-unclass-01"}).encode('utf-8'),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=1.5) as response:
                  latency_ms = (time.time() - t0) * 1000.0
                  status = response.status
                  print(f"[{ts}] SEQ={seq:05d} SUCCESS status={status} latency={latency_ms:.2f}ms")
          except Exception as e:
              latency_ms = (time.time() - t0) * 1000.0
              print(f"[{ts}] SEQ={seq:05d} DROPPED/TIMEOUT error={e} latency={latency_ms:.2f}ms", file=sys.stderr)
          time.sleep(1.0)

  - path: /etc/systemd/system/enclave-c2-probe.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Enclave C2 Telemetry Prober
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/enclave-client/c2_probe.py
      Restart=always
      User=${admin_username}

  - path: /etc/systemd/system/c2-streamer.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Tactical Enclave High-Rate C2 UDP Streamer
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/tactical-sdn
      ExecStart=/usr/bin/python3 /opt/tactical-sdn/src/traffic/c2_streamer.py --target 10.200.1.10 --port 9000 --status-port 9001 --rate 40 --size 512
      Restart=always
      RestartSec=2
      User=${admin_username}
      Environment=PYTHONPATH=/opt/tactical-sdn

      [Install]
      WantedBy=multi-user.target

  - path: /tmp/app_bundle.zip.b64
    permissions: '0600'
    content: |
      ${app_zip_b64}

runcmd:
  - mkdir -p /opt/tactical-sdn/src
  - base64 -d /tmp/app_bundle.zip.b64 > /tmp/app_bundle.zip
  - python3 -m zipfile -e /tmp/app_bundle.zip /opt/tactical-sdn/src
  - chown -R ${admin_username}:${admin_username} /opt/tactical-sdn
  - rm -f /tmp/app_bundle.zip*
  - systemctl daemon-reload
  - systemctl enable --now enclave-c2-probe.service
  - systemctl enable --now c2-streamer.service
