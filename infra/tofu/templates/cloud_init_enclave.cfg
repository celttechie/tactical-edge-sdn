#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.tactical.local
manage_etc_hosts: true

users:
  - name: ${admin_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, netdev]
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /opt/enclave-client/c2_probe.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      import time
      import urllib.request
      import json
      import sys
      import datetime

      TARGET_URL = "http://10.200.1.10:8080"

      print(f"Starting Enclave C2 Heartbeat Prober targeting {TARGET_URL}...")
      seq = 0
      while True:
          seq += 1
          t0 = time.time()
          ts = datetime.datetime.utcnow().isoformat()
          try:
              req = urllib.request.Request(
                  TARGET_URL,
                  data=json.dumps({"seq": seq, "timestamp": ts, "source": "enclave-unclass-01"}).encode('utf-8'),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=1.5) as response:
                  latency_ms = (time.time() - t0) * 1000.0
                  status = response.status
                  print(f"[{ts}] SEQ={seq:05d} SUCCESS status={status} latency={latency_ms:.2f}ms")
          except Exception as e:
              latency_ms = (time.time() - t0) * 1000.0
              print(f"[{ts}] SEQ={seq:05d} DROPPED/TIMEOUT error={e} latency={latency_ms:.2f}ms", file=sys.stderr)
          time.sleep(1.0)

  - path: /etc/systemd/system/enclave-c2-probe.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Enclave C2 Telemetry Prober
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/enclave-client/c2_probe.py
      Restart=always
      User=${admin_username}

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now enclave-c2-probe.service
