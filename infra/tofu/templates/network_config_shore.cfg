version: 2
ethernets:
  eth0:
    match:
      macaddress: "52:54:00:20:01:01"
    set-name: eth-pleops
    addresses:
      - 10.100.1.1/24
  eth1:
    match:
      macaddress: "52:54:00:20:02:01"
    set-name: eth-milsat
    addresses:
      - 10.100.2.1/24
  eth2:
    match:
      macaddress: "52:54:00:20:03:01"
    set-name: eth-losrf
    addresses:
      - 10.100.3.1/24
  eth3:
    match:
      macaddress: "52:54:00:30:01:01"
    set-name: eth-shorehub
    addresses:
      - 10.200.1.10/24
    routes:
      - to: default
        via: 10.200.1.1
    nameservers:
      addresses:
        - 1.1.1.1
        - 8.8.8.8
