#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.tactical.local
manage_etc_hosts: true

users:
  - name: ${admin_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, netdev]
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_keys:
  ed25519_private: |
    ${indent(4, host_private_key)}
  ed25519_public: ${host_public_key}

write_files:
  - path: /etc/sysctl.d/99-shore.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0

  - path: /opt/tactical-sdn/id_ed25519
    permissions: '0600'
    content: |
      ${indent(6, host_private_key)}

  - path: /opt/tactical-sdn/ssh_config
    permissions: '0644'
    content: |
      Host ship-gateway 10.200.1.2
        HostName 10.200.1.2
        User ${admin_username}
        IdentityFile ~/.ssh/id_ed25519
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null

  - path: /etc/systemd/system/shore-dashboard.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Tactical Edge SD-WAN Operations HUD & Modernization Orchestrator
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/tactical-sdn
      ExecStart=/usr/bin/python3 -m src.dashboard.server --port 8080
      Restart=always
      RestartSec=2
      User=${admin_username}
      Environment=PYTHONPATH=/opt/tactical-sdn

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/shore-receiver.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Tactical C2 UDP Telemetry Receiver and Gap Ingest
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/tactical-sdn
      ExecStart=/usr/bin/python3 /opt/tactical-sdn/src/traffic/shore_receiver.py --port 9000 --status-port 9001
      Restart=always
      RestartSec=2
      User=${admin_username}
      Environment=PYTHONPATH=/opt/tactical-sdn

      [Install]
      WantedBy=multi-user.target

  - path: /tmp/app_bundle.zip.b64
    permissions: '0600'
    content: |
      ${app_zip_b64}

runcmd:
  - sysctl --system
  - mkdir -p /opt/tactical-sdn/src /home/${admin_username}/.ssh
  - cp /opt/tactical-sdn/id_ed25519 /home/${admin_username}/.ssh/id_ed25519
  - cp /opt/tactical-sdn/ssh_config /home/${admin_username}/.ssh/config
  - chown -R ${admin_username}:${admin_username} /home/${admin_username}/.ssh
  - chmod 700 /home/${admin_username}/.ssh
  - chmod 600 /home/${admin_username}/.ssh/id_ed25519
  - base64 -d /tmp/app_bundle.zip.b64 > /tmp/app_bundle.zip
  - python3 -m zipfile -e /tmp/app_bundle.zip /opt/tactical-sdn/src
  - chown -R ${admin_username}:${admin_username} /opt/tactical-sdn
  - rm -f /tmp/app_bundle.zip*
  - systemctl daemon-reload
  - systemctl enable --now shore-dashboard.service
  - systemctl enable --now shore-receiver.service
