#cloud-config
hostname: ${hostname}
fqdn: ${hostname}.tactical.local
manage_etc_hosts: true

users:
  - name: ${admin_username}
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, netdev]
    ssh_authorized_keys:
      - ${ssh_public_key}

ssh_keys:
  ed25519_private: |
    ${indent(4, host_private_key)}
  ed25519_public: ${host_public_key}

write_files:
  - path: /etc/sysctl.d/99-shore.conf
    permissions: '0644'
    content: |
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
      net.ipv4.conf.all.rp_filter = 0
      net.ipv4.conf.default.rp_filter = 0

  - path: /opt/shore-telemetry/server.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      import http.server
      import socketserver
      import datetime
      import json

      PORT = 8080

      class ShoreTelemetryHandler(http.server.SimpleHTTPRequestHandler):
          timeout = 5

          def do_GET(self):
              self.send_response(200)
              self.send_header('Content-type', 'application/json')
              self.end_headers()
              resp = {
                  "status": "OPERATIONAL",
                  "node": "SHORE-GATEWAY-HQ",
                  "timestamp": datetime.datetime.utcnow().isoformat(),
                  "active_bearers": ["pleops", "milsat", "losrf"]
              }
              self.wfile.write(json.dumps(resp).encode('utf-8'))

          def do_POST(self):
              content_length = int(self.headers.get('Content-Length', 0))
              post_data = self.rfile.read(content_length)
              self.send_response(201)
              self.send_header('Content-type', 'application/json')
              self.end_headers()
              self.wfile.write(b'{"status":"RECEIVED"}')

      class ThreadingHTTPServer(socketserver.ThreadingMixIn, socketserver.TCPServer):
          daemon_threads = True
          allow_reuse_address = True

      with ThreadingHTTPServer(("", PORT), ShoreTelemetryHandler) as httpd:
          print(f"Shore Telemetry Server listening on port {PORT}")
          httpd.serve_forever()

  - path: /etc/systemd/system/shore-telemetry.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Simulated Shore C2 / Telemetry Endpoint
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/shore-telemetry/server.py
      Restart=always
      User=${admin_username}

  - path: /etc/systemd/system/shore-receiver.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Tactical C2 UDP Telemetry Receiver and Gap Ingest
      After=network.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/tactical-sdn
      ExecStart=/usr/bin/python3 /opt/tactical-sdn/src/traffic/shore_receiver.py --port 9000 --status-port 9001
      Restart=always
      RestartSec=2
      User=${admin_username}
      Environment=PYTHONPATH=/opt/tactical-sdn

      [Install]
      WantedBy=multi-user.target

  - path: /tmp/app_bundle.zip.b64
    permissions: '0600'
    content: |
      ${app_zip_b64}

runcmd:
  - sysctl --system
  - mkdir -p /opt/tactical-sdn/src
  - base64 -d /tmp/app_bundle.zip.b64 > /tmp/app_bundle.zip
  - python3 -m zipfile -e /tmp/app_bundle.zip /opt/tactical-sdn/src
  - chown -R ${admin_username}:${admin_username} /opt/tactical-sdn
  - rm -f /tmp/app_bundle.zip*
  - systemctl daemon-reload
  - systemctl enable --now shore-telemetry.service
  - systemctl enable --now shore-receiver.service
