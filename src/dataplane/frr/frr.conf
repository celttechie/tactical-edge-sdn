frr version 8.5
frr defaults traditional
hostname tactical-edge-router
log stdout informational
no ipv6 forwarding
service integrated-vtysh-config
!
ip forwarding
!
bfd
 peer 10.100.1.1 interface eth-pleops
  detect-multiplier 3
  receive-interval 100
  transmit-interval 100
 !
 peer 10.100.2.1 interface eth-milsat
  detect-multiplier 3
  receive-interval 250
  transmit-interval 250
 !
 peer 10.100.3.1 interface eth-losrf
  detect-multiplier 3
  receive-interval 150
  transmit-interval 150
 !
!
router bgp 65001
 bgp router-id 10.10.1.1
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 maximum-paths 3
 !
 neighbor SHORE_PEERS peer-group
 neighbor SHORE_PEERS remote-as 65000
 neighbor SHORE_PEERS bfd
 !
 neighbor 10.100.1.1 peer-group SHORE_PEERS
 neighbor 10.100.1.1 description P-LEO-Satellite-Primary
 neighbor 10.100.1.1 route-map RM_PLEOPS_IN in
 !
 neighbor 10.100.2.1 peer-group SHORE_PEERS
 neighbor 10.100.2.1 description MILSATCOM-GEO-Secondary
 neighbor 10.100.2.1 route-map RM_MILSAT_IN in
 !
 neighbor 10.100.3.1 peer-group SHORE_PEERS
 neighbor 10.100.3.1 description Tactical-LOS-RF-Tertiary
 neighbor 10.100.3.1 route-map RM_LOSRF_IN in
 !
 address-family ipv4 unicast
  network 10.10.1.0/24
  network 10.10.2.0/24
  neighbor SHORE_PEERS activate
 exit-address-family
!
route-map RM_PLEOPS_IN permit 10
 set local-preference 200
!
route-map RM_MILSAT_IN permit 10
 set local-preference 150
!
route-map RM_LOSRF_IN permit 10
 set local-preference 100
!
line vty
!
